storage:
  ram:
    max: '100m'
  disk:
    max: '1g'

server:
  port: 8082
  origin: https://devforth.io/
  invalidation:
    enabled: true
    queue_size: 64
    worker_concurrency: 4
    max_body_bytes: 1048576
    max_paths_per_request: 1000
    max_tags_per_request: 1000
    hard_limits: false

auth:
  tokens:
    # Used by debug dashboard bridge endpoints:
    # - GET /wait0/dashboard/stats (stats:read)
    # - POST /wait0/dashboard/invalidate (invalidation:write)
    - id: local-backoffice
      # Fixed local-development credential. Never use this config in production.
      token: demotoken
      # token_env: WAIT0_API_AUTH_TOKEN
      scopes:
        - invalidation:write
        - stats:read

urlsDiscover:
  initalDelay: '20s'
  rediscoverEvery: '10m'
  sitemaps:
    - https://devforth.io/sitemap.xml

rules:
  - match: PathPrefix(/api) | PathPrefix(/admin) | PathPrefix(/lab)
    priority: 1
    bypass: true
  - match: PathPrefix(/)
    priority: 2
    bypassWhenCookies:
      - sessionid
    # bypassWhenRequestHeaders:
    #   - Authorization
    expiration: '10s'
    warmUp:
      pauseBetweenRuns: '10s'
      maxRequestsAtATime: 1000

logging:
  # Diagnostic response headers and origin revalidation markers.
  # Omit debug_headers to enable all supported headers by default.
  debug_headers:
    - X-Wait0
    - X-Wait0-Reason
    - X-Wait0-Revalidated-At
    - X-Wait0-Revalidated-By
    - X-Wait0-Discovered-By
    - X-Wait0-Revalidate-At
    - X-Wait0-Revalidate-Entropy
  # To disable every diagnostic header, replace the list above with:
  # debug_headers: []
  # log stats when enabled logs
  log_stats_every: '10s'
  log_warmup: true
  log_url_autodiscover: true
